<style>
    .manage-wrap { max-width: 980px; margin: 0 auto; }

    .manage-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 22px;
    }

    .manage-head h2 { margin: 0; }

    /* Buttons */
    .m-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 18px;
        border-radius: 10px;
        border: 1px solid transparent;
        text-decoration: none;
        font-size: 14px;
        line-height: 1.2;
    }

    body .m-light { background: #fff; color: #172a26; border-color: #d9e5e0; }
    body .m-light:hover { background: #eaf4f0; border-color: #6AA698; }

    body .m-danger { background: #fff; color: #c0392b; border-color: #f1c4bf; }
    body .m-danger:hover { background: #c0392b; color: #fff; border-color: #c0392b; }

    .m-btn[disabled] { opacity: .7; pointer-events: none; }

    .m-spinner {
        width: 15px;
        height: 15px;
        border: 2px solid #ffffff66;
        border-top-color: #fff;
        border-radius: 50%;
        animation: m-spin .7s linear infinite;
    }

    @keyframes m-spin { to { transform: rotate(360deg); } }

    /* Flash messages */
    .flash-wrap { display: grid; gap: 10px; margin-bottom: 20px; }

    .flash {
        padding: 13px 16px;
        border-radius: 10px;
        font-weight: 600;
        background: #e2f0eb;
        color: #285f52;
        border: 1px solid #b7d8cc;
        animation: fx-rise .35s ease both;
    }

    .flash-error, .flash-warning {
        background: #fdecea;
        color: #b03a2e;
        border-color: #f1c4bf;
    }

    /* Form */
    .form-card {
        background: #fff;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 8px 28px #172a2614;
    }

    .form-section-title {
        margin: 26px 0 16px;
        padding-bottom: 10px;
        border-bottom: 2px solid #e2f0eb;
        color: #285f52;
        font-size: 18px;
    }

    .form-section-title:first-of-type { margin-top: 0; }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
    }

    .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .form-grid .field.wide { grid-column: 1 / -1; }

    .form-card .field select,
    .form-card .field textarea,
    .form-card .field input[type="text"],
    .form-card .field input[type="number"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #d9e1dd;
        border-radius: 8px;
        background: #fff;
        color: #172a26;
        font: inherit;
    }

    .form-card .field textarea { resize: vertical; min-height: 120px; }

    .form-card .field input[type="file"] {
        padding: 14px;
        border: 2px dashed #b7d8cc;
        border-radius: 10px;
        background: #f4faf7;
        cursor: pointer;
    }

    .form-card .field input[type="file"]:hover { border-color: #6AA698; }

    .field small { color: #6b7d77; font-size: 12px; }

    .field-error { color: #c0392b; font-size: 13px; font-weight: 600; }

    .field.has-error input,
    .field.has-error select,
    .field.has-error textarea { border-color: #e74c3c; }

    .form-alert {
        margin-bottom: 18px;
        padding: 13px 16px;
        border-radius: 10px;
        background: #fdecea;
        color: #b03a2e;
        border: 1px solid #f1c4bf;
        font-weight: 600;
    }

    .check {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        cursor: pointer;
    }

    .check input { width: 20px; height: 20px; accent-color: #438575; }

    .photo-previews {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 10px;
        margin-top: 10px;
    }

    .photo-previews:empty { display: none; }

    .photo-previews img,
    .existing-photo img {
        width: 100%;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        display: block;
    }

    .photo-previews img { animation: fx-rise .3s ease both; }

    .existing-photo {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
    }

    .existing-photo label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 28px;
        flex-wrap: wrap;
    }

    /* My Properties list */
    .manage-list { display: grid; gap: 16px; }

    .manage-row {
        display: flex;
        gap: 18px;
        align-items: center;
        background: #fff;
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 4px 18px #0000000d;
        animation: fx-rise .4s ease both;
    }

    .manage-thumb {
        flex: 0 0 120px;
        height: 90px;
        border-radius: 10px;
        overflow: hidden;
        background: #e2f0eb;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #438575;
        font-size: 12px;
        font-weight: 700;
    }

    .manage-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .manage-info { flex: 1; min-width: 0; }

    .manage-info h3 { margin: 0 0 4px; font-size: 17px; }

    .manage-info p { margin: 2px 0; color: #5d6f69; font-size: 14px; }

    .manage-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

    .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        background: #e2f0eb;
        color: #285f52;
    }

    .badge.off { background: #f1f1f1; color: #777; }
    .badge.saved { background: #fdecee; color: #c0392b; }

    .manage-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

    .manage-actions form { margin: 0; }

    @media (max-width: 760px) {
        .form-card { padding: 20px 16px; }
        .form-grid, .form-grid.three { grid-template-columns: 1fr; }
        .manage-row { flex-direction: column; align-items: stretch; }
        .manage-thumb { flex-basis: auto; height: 160px; }
        .manage-actions { justify-content: flex-start; }
        .form-actions .m-btn { flex: 1; }
    }
</style>
